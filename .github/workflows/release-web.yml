name: "release-web"

# Release entrypoint for Cap Web (the self-hosted server image). Push a
# cap-web-v{version} tag, or dispatch with a version, and this runs the JS
# gates, builds the multi-arch ghcr.io/{owner}/cap-web image via
# docker-build-web.yml, and publishes a GitHub release with the self-hosting
# compose files attached.
#
# Desktop releases are unaffected and stay in publish.yml / desktop-release.yml,
# which use the cap-v{version} tag namespace.

on:
  push:
    tags:
      - "cap-web-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, eg. 0.1.0"
        required: true
        type: string
      draft:
        description: "Publish the GitHub release as a draft"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-web-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION:-$REF_NAME}"
          version="${raw#cap-web-v}"
          version="${version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' does not resolve to a semver version (expected x.y.z or x.y.z-prerelease)"
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi

          {
            echo "version=$version"
            echo "tag=cap-web-v$version"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-js

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          # Pinned for the same reason as ci.yml: Biome errors when its version
          # doesn't match the schema version in biome.json.
          version: 2.2.0

      - name: Check formatting
        run: biome ci . --linter-enabled=false

      - run: pnpm web exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:web

  image:
    name: Web Image
    needs: [resolve, verify]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build-web.yml
    with:
      tag: ${{ needs.resolve.outputs.version }}
      extra_tags: ${{ needs.resolve.outputs.prerelease == 'true' && '' || 'latest' }}

  release:
    name: GitHub Release
    needs: [resolve, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Downcase GITHUB_REPOSITORY_OWNER
        run: |
          echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}

      - name: Write release body
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cat >release-body.md <<EOF
          Self-hosted Cap Web \`$VERSION\`.

          \`\`\`bash
          docker pull ghcr.io/${REPOSITORY_OWNER}/cap-web:$VERSION
          \`\`\`

          The compose files attached below match this release. See the
          [self-hosting docs](https://cap.so/docs/self-hosting) for configuration,
          including Google, Apple, Keycloak, and SAML SSO.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Cap Web ${{ needs.resolve.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          # The "Latest" badge belongs to the desktop app releases users download
          # from the website, so a web image release never claims it.
          make_latest: "false"
          files: |
            docker-compose.yml
            docker-compose.coolify.yml
            docker-compose.coolify.env.example
